<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacta con OT Factory para tu proyecto de automatización industrial">
  <title>Contacto - OT Factory</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- HEADER -->
  <header>
    <nav>
      <div class="logo">
        <img src="img/logo.svg" alt="OT Factory Logo">
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#soluciones">Soluciones</a></li>
        <li><a href="#contacto" class="cta-button">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTACT SECTION -->
  <section class="contact" id="contacto">
    <div class="container">
      <h2>Contacta con Nosotros</h2>
      <p style="margin-bottom: 3rem;">Cuéntanos sobre tu proyecto y nos pondremos en contacto lo antes posible</p>

      <div style="max-width: 600px; margin: 0 auto; background: var(--primary-dark); padding: 3rem 2rem; border-radius: 12px;">
        <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="b4d6295d-f645-469c-8a57-26936ec2b3ee">
          <input type="hidden" name="subject" value="Nuevo mensaje desde otfactory.es">
          <input type="hidden" name="from_name" value="OT Factory Web">
          <input type="hidden" name="redirect" value="https://otfactory.es?enviado=1">
          <input type="checkbox" name="botcheck" style="display:none">
          <div class="form-group">
            <label for="name">Nombre Completo *</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="company">Empresa</label>
            <input type="text" id="company" name="company">
          </div>

          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input type="tel" id="phone" name="phone">
          </div>

          <div class="form-group">
            <label for="subject">Asunto *</label>
            <input type="text" id="subject" name="subject" required>
          </div>

          <div class="form-group">
            <label for="message">Mensaje *</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button type="submit" class="form-submit">Enviar Mensaje</button>
        </form>
      </div>

      <!-- ALTERNATE CONTACT -->
      <div class="contact-info" style="margin-top: 3rem; text-align: center;">
        <div class="info-item" style="text-align: center;">
          <h3>O escríbenos directamente</h3>
          <p><a href="mailto:info@otfactory.es" style="font-size: 1.2rem; font-weight: 600;">info@otfactory.es</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2024 OT Factory. Todos los derechos reservados.</p>
    <p>
      <a href="#">Política de Privacidad</a> |
      <a href="#">Política de Cookies</a> |
      <a href="#">Aviso Legal</a>
    </p>
  </footer>

</body>
</html>
